[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ComicAPNG"
version = "1.0.0"
description = "Create, extract, and read APNG comic books"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ComicAPNG contributors" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "jmcomic>=2.7.5,<2.8",
    "Pillow>=10.3",
    "PySide6>=6.7",
    "platformdirs>=4.2",
    "qtawesome>=1.3",
]

[project.optional-dependencies]
dev = [
    "PyInstaller>=6.8",
    "PyYAML>=6.0",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.gui-scripts]
ComicAPNG = "comicapng.app:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
comicapng = [
    "extensions/*/manifest.json",
    "extensions/*/README.md",
    "resources/i18n/*.json",
    "resources/icons/*.png",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
